{% extends "base.html" %}

{% block title %}Підтвердження видалення{% endblock %}

{% block content %}
<div style="max-width: 560px; margin: 0 auto;">

    <header style="margin-bottom: 24px;">
        <span class="eyebrow" style="color: var(--clay);">Видалення</span>
        <h1 style="font-size: 32px; margin-top: 8px;">
            Видалити «{{ object }}»?
        </h1>
    </header>

    <div class="card" style="padding: 24px; margin-bottom: 24px;">
        <p style="margin: 0; color: var(--ink-soft);">
            {% block delete_warning %}
                Ця дія незворотна. Дані буде видалено назавжди.
            {% endblock %}
        </p>
    </div>

    <form method="post">
        {% csrf_token %}

        <div style="display: flex; gap: 12px;">
            <button type="submit" class="btn btn-primary" style="background: var(--clay);">
                Так, видалити
            </button>
            <a href="{{ request.META.HTTP_REFERER }}" class="btn btn-outline">
                Скасувати
            </a>
        </div>
    </form>
</div>
{% endblock %}
