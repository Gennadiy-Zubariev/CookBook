{% extends "base.html" %}

{% block title %}Підтвердження видалення{% endblock %}

{% block content %}
<div class="delete-wrapper">

  <header class="page-header">
    <span class="eyebrow eyebrow-danger">Видалення</span>
    <h1 class="form-title">Видалити «{{ object }}»?</h1>
  </header>

  <div class="card delete-warning">
    <p>
      {% block delete_warning %}
      Ця дія незворотна. Дані буде видалено назавжди.
      {% endblock %}
    </p>
  </div>

  <form method="post">
    {% csrf_token %}
    <div class="form-actions" style="border: none; padding-top: 0; margin-top: 0;">
      <button type="submit" class="btn btn-danger">Так, видалити</button>
      <a href="javascript:history.back()" class="btn btn-outline">Скасувати</a>
    </div>
  </form>
</div>
{% endblock %}
